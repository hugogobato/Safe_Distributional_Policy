[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-dist-policy"
version = "0.1.0"
description = "Finite-sample comparative distributional policy certification"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy==2.4.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7", "mypy==1.19.1"]

[tool.setuptools.package-data]
safe_dist_policy = ["*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
